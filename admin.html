<!doctype html>
<!-- พัฒนาโดย fonkosin -->
<html lang="th">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตรวจงานช่าง · KOSIN</title>
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#F5620F">
<style>
  :root{--green:#F5620F;--green-dk:#ffffff;--brand-tint:#FFF0E6;--brand-tintbg:#fff4ec;--brand-tintborder:#f5cba3;--brand-dark:#b34205;--bg:#f5f4f2;--card:#fff;--line:#e6e4e0;--line2:#d3d0ca;
    --txt:#1a1d21;--mut:#6b7280;--mut2:#9aa0a8;--accent:#185FA5;--accent-bg:#E6F1FB;--danger:#A32D2D;--danger-bg:#FCEBEB;
    --ok:#0F6E56;--ok-bg:#E1F5EE;--amber:#854F0B;--amber-bg:#FAEEDA}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Thai","Sarabun",sans-serif;background:var(--bg);color:var(--txt);font-size:14.5px;line-height:1.5}
  .wrap{max-width:900px;margin:0 auto;padding:0 0 60px}
  .top{background:var(--green);color:var(--green-dk);padding:16px 20px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px}
  .top h1{font-size:17px;margin:0;font-weight:600}
  .top .sub{font-size:11.5px;opacity:.85;margin-top:1px}
  .top .refresh{margin-left:auto;background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:9px;padding:8px 14px;font-size:12.5px;cursor:pointer;font-family:inherit}
  .bar2{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;position:sticky;top:56px;z-index:19;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .ftab{border:none;background:var(--bg);color:var(--mut);font-family:inherit;font-size:13px;font-weight:500;padding:8px 14px;border-radius:20px;cursor:pointer}
  .ftab.on{background:var(--green);color:#fff}
  .sel{border:1px solid var(--line2);border-radius:9px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fff;color:var(--txt);margin-left:auto}
  .content{padding:14px 20px}
  .empty{text-align:center;color:var(--mut);padding:60px 20px;font-size:14px}
  .techgrp{margin-bottom:18px}
  .techgrp-h{display:flex;align-items:center;gap:10px;padding:10px 4px;flex-wrap:wrap}
  .techgrp-h .nm{font-size:15px;font-weight:600}
  .techgrp-h .cnt{font-size:11.5px;color:var(--mut)}
  .approveAllBtn{margin-left:auto;background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok);border-radius:9px;padding:7px 13px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:10px}
  .card .r1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
  .card .lbl{font-size:14px;font-weight:600}
  .card .meta{font-size:12px;color:var(--mut);margin-top:2px}
  .badge{font-size:11px;padding:3px 9px;border-radius:20px;white-space:nowrap;font-weight:500}
  .st-wait{background:var(--amber-bg);color:var(--amber)}
  .st-ok{background:var(--ok-bg);color:var(--ok)}
  .st-no{background:var(--danger-bg);color:var(--danger)}
  .row2{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin:8px 0}
  .row2 b{color:var(--txt);font-weight:600}
  .flags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .flag{font-size:11px;background:var(--danger-bg);color:var(--danger);padding:3px 9px;border-radius:20px}
  .note{font-size:12.5px;background:var(--bg);border-radius:9px;padding:8px 11px;margin:8px 0;color:var(--txt)}
  .photos{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .photolink{font-size:12px;color:var(--accent);text-decoration:none;background:var(--accent-bg);padding:6px 11px;border-radius:8px}
  .actions{display:flex;gap:8px;margin-top:10px}
  .abtn{flex:1;border:none;border-radius:9px;padding:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  .abtn.ok{background:var(--ok);color:#fff}
  .abtn.no{background:var(--danger);color:#fff}
  .abtn:disabled{opacity:.4;cursor:default}
  .points{font-size:12px;color:var(--accent);font-weight:600}
  .loading{text-align:center;color:var(--mut);padding:60px 20px}
  .hidden{display:none !important}
  .lockwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .lockbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px;max-width:320px;width:100%;text-align:center}
  .lockbox .ic{font-size:32px;margin-bottom:8px}
  .lockbox h2{font-size:16px;margin:0 0 4px}
  .lockbox p{font-size:12.5px;color:var(--mut);margin:0 0 16px}
  .lockbox input{width:100%;border:1px solid var(--line2);border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit;text-align:center;margin-bottom:10px;box-sizing:border-box}
  .lockbox button{width:100%;background:var(--green);color:var(--green-dk);border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  .lockbox .err{color:var(--danger);font-size:12px;margin-top:8px;min-height:16px}
</style>
</head>
<body>
<div class="lockwrap" id="lockScreen">
  <div class="lockbox">
    <div class="ic">🔒</div>
    <h2>หน้าตรวจงานช่าง</h2>
    <p>ใส่รหัสผ่านเพื่อเข้าใช้งาน</p>
    <input type="password" id="lockPass" placeholder="รหัสผ่าน" autocomplete="off">
    <input type="text" id="lockReviewer" placeholder="ชื่อผู้ตรวจ (คุณคือใคร)" autocomplete="off" style="margin-top:-2px">
    <button id="lockBtn">เข้าใช้งาน</button>
    <div class="err" id="lockErr"></div>
  </div>
</div>
<div class="wrap hidden" id="mainWrap">
  <div class="top">
    <div>
      <h1>🔧 ตรวจงานช่าง</h1>
      <div class="sub">KOSIN · หลังบ้าน · ผู้ตรวจ: <span id="reviewerLabel"></span> <a href="#" id="changeReviewer" style="color:inherit;text-decoration:underline">(เปลี่ยน)</a></div>
    </div>
    <button class="refresh" id="refreshBtn">🔄 รีเฟรช</button>
  </div>
  <div class="bar2">
    <button class="ftab on" data-f="รอตรวจ">รอตรวจ</button>
    <button class="ftab" data-f="ผ่าน">ผ่าน</button>
    <button class="ftab" data-f="ไม่ผ่าน">ไม่ผ่าน</button>
    <button class="ftab" data-f="all">ทั้งหมด</button>
    <select class="sel" id="techFilter"><option value="">ทุกคน</option></select>
  </div>
  <div class="content" id="content"><div class="loading">กำลังโหลดข้อมูล…</div></div>
</div>
<script src="config.js"></script>
<script>
const SUBMIT_URL=(window.APP_CONFIG&&window.APP_CONFIG.SUBMIT_URL)||"";
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
function applyTheme(){
  const th=(window.APP_CONFIG&&window.APP_CONFIG.THEME)||null; if(!th||!th.brand)return;
  document.documentElement.style.setProperty('--green',th.brand);
  document.documentElement.style.setProperty('--green-dk',th.onBrand||'#ffffff');
}
let reports=[], curFilter='รอตรวจ', curTech='';

function loadReports(){
  $('#content').innerHTML='<div class="loading">กำลังโหลดข้อมูล…</div>';
  if(!SUBMIT_URL){$('#content').innerHTML='<div class="empty">ยังไม่ได้ตั้งค่า SUBMIT_URL ใน config.js</div>';return;}
  window.__kosinReports=function(d){reports=(d&&d.reports)||[];buildTechFilter();render();};
  const s=document.createElement('script');
  s.src=SUBMIT_URL+(SUBMIT_URL.indexOf('?')<0?'?':'&')+'reports=1&callback=__kosinReports';
  s.onerror=function(){$('#content').innerHTML='<div class="empty">โหลดข้อมูลไม่สำเร็จ — ลองรีเฟรชอีกครั้ง</div>';};
  document.body.appendChild(s);
}
function buildTechFilter(){
  const sel=$('#techFilter'), cur=sel.value;
  const names=[...new Set(reports.map(r=>r.tech))].sort();
  sel.innerHTML='<option value="">ทุกคน</option>'+names.map(n=>'<option value="'+n+'">'+n+'</option>').join('');
  sel.value=cur;
}
function fmtFlags(f){ if(!f) return []; return String(f).split(',').map(x=>x.trim()).filter(Boolean); }
function statusBadge(st){
  if(st==='ผ่าน')return '<span class="badge st-ok">ผ่าน</span>';
  if(st==='ไม่ผ่าน')return '<span class="badge st-no">ไม่ผ่าน</span>';
  if(st==='รอเอกสาร')return '<span class="badge st-wait">รอเอกสาร</span>';
  return '<span class="badge st-wait">รอตรวจ</span>';
}
function render(){
  let list=reports;
  if(curFilter!=='all') list=list.filter(r=>r.status===curFilter || (curFilter==='รอตรวจ'&&!r.status));
  if(curTech) list=list.filter(r=>r.tech===curTech);
  if(!list.length){$('#content').innerHTML='<div class="empty">ไม่มีรายการในหมวดนี้</div>';return;}
  const byTech={};
  list.forEach(r=>{(byTech[r.tech]=byTech[r.tech]||[]).push(r);});
  let h='';
  Object.keys(byTech).sort().forEach(tech=>{
    const rows=byTech[tech];
    const pendingCount=rows.filter(r=>!r.status||r.status==='รอตรวจ').length;
    h+='<div class="techgrp"><div class="techgrp-h"><span class="nm">👤 '+tech+'</span><span class="cnt">'+rows.length+' งาน</span>'+
      (pendingCount>1?'<button class="approveAllBtn" data-approveall="'+tech+'">✓ อนุมัติทั้งหมด ('+pendingCount+')</button>':'')+'</div>';
    rows.forEach(r=>{
      const flags=fmtFlags(r.flags);
      const photos=(r.photoLinks?String(r.photoLinks).split('\n').filter(Boolean):[]);
      const st=r.status||'รอตรวจ';
      h+='<div class="card" data-id="'+r.id+'">'+
        '<div class="r1"><div><div class="lbl">'+r.code+' · '+r.label+'</div><div class="meta">'+r.dateTh+' · 📍 '+r.hospital+(r.reviewer?(' · ตรวจโดย '+r.reviewer):'')+'</div></div>'+statusBadge(st)+'</div>'+
        '<div class="row2"><span>ค่าตอบแทน: <b>'+(r.travel||0)+' บาท</b> ('+(r.allowanceType||'-')+(r.period?(' · '+r.period):'')+')</span><span>คะแนน: <b class="points">'+(r.points||0)+'</b></span>'+
        (r.lateDays?('<span style="color:var(--danger)">⏰ ส่งสาย '+r.lateDays+' วัน</span>'):'')+
        (r.isHoliday?('<span>🌴 วันหยุด'+(r.holidayBonus?(' · ค่า Workshop วันหยุด +'+r.holidayBonus):'')+(r.ot?' · มี OT':'')+'</span>'):'')+
        '</div>'+
        (r.note?('<div class="note">📝 '+r.note+'</div>'):'')+
        (r.reportNote?('<div class="note" style="background:var(--amber-bg);color:var(--amber)">✏️ หมายเหตุแก้ไข: '+r.reportNote+'</div>'):'')+
        (flags.length?('<div class="flags">'+flags.map(f=>'<span class="flag">⚑ '+f+'</span>').join('')+'</div>'):'')+
        (photos.length?('<div class="photos">'+photos.map((p,i)=>'<a class="photolink" href="'+p+'" target="_blank" rel="noopener">📷 รูปที่ '+(i+1)+'</a>').join('')+'</div>'):'<div class="meta">ไม่มีรูปแนบ</div>')+
        '<div class="actions">'+
          '<button class="abtn ok" data-approve="'+r.id+'" '+(st==='ผ่าน'?'disabled':'')+'>✓ ผ่าน</button>'+
          '<button class="abtn no" data-reject="'+r.id+'" '+(st==='ไม่ผ่าน'?'disabled':'')+'>✗ ไม่ผ่าน</button>'+
        '</div>'+
      '</div>';
    });
    h+='</div>';
  });
  $('#content').innerHTML=h;
  $$('[data-approve]').forEach(b=>b.onclick=()=>setStatus(b.getAttribute('data-approve'),'ผ่าน'));
  $$('[data-reject]').forEach(b=>b.onclick=()=>setStatus(b.getAttribute('data-reject'),'ไม่ผ่าน'));
  $$('[data-approveall]').forEach(b=>b.onclick=()=>approveAll(b.getAttribute('data-approveall'),b));
}
function reviewerName(){ return localStorage.getItem('kosin_reviewer_name')||''; }
function setStatus(id,status){
  const r=reports.find(x=>x.id===id); if(r)r.status=status;
  render();
  fetch(SUBMIT_URL,{method:'POST',body:JSON.stringify({action:(status==='ผ่าน'?'approve':'reject'),id:id,reviewer:reviewerName()})}).catch(()=>{});
}
function approveAll(tech,btn){
  btn.disabled=true;btn.textContent='กำลังอนุมัติ…';
  reports.forEach(r=>{if(r.tech===tech&&(!r.status||r.status==='รอตรวจ'))r.status='ผ่าน';});
  render();
  fetch(SUBMIT_URL,{method:'POST',body:JSON.stringify({action:'approveAll',tech:tech,reviewer:reviewerName()})}).catch(()=>{});
}
$$('.ftab').forEach(b=>b.onclick=()=>{$$('.ftab').forEach(x=>x.classList.remove('on'));b.classList.add('on');curFilter=b.dataset.f;render();});
$('#techFilter').onchange=e=>{curTech=e.target.value;render();};
$('#refreshBtn').onclick=loadReports;
applyTheme();

/* ล็อกด้วยรหัสผ่านง่ายๆ ฝั่ง browser — กันคนทั่วไปเปิดลิงก์เข้าถึงโดยไม่ตั้งใจ ไม่ใช่ระบบความปลอดภัยจริงจัง */
function unlock(){
  $('#lockScreen').classList.add('hidden');
  $('#mainWrap').classList.remove('hidden');
  $('#reviewerLabel').textContent=reviewerName();
  loadReports();
}
$('#changeReviewer').addEventListener('click',e=>{
  e.preventDefault();
  sessionStorage.removeItem('kosin_admin_ok');
  $('#mainWrap').classList.add('hidden');
  $('#lockScreen').classList.remove('hidden');
  $('#lockPass').value='';
  $('#lockReviewer').focus();
});
$('#lockReviewer').value=reviewerName();
function tryUnlock(){
  const pass=(window.APP_CONFIG&&window.APP_CONFIG.ADMIN_PASSWORD)||'';
  const val=$('#lockPass').value;
  const rv=$('#lockReviewer').value.trim();
  if(!rv){
    $('#lockErr').textContent='กรอกชื่อผู้ตรวจก่อนนะคะ';
    $('#lockReviewer').focus();
    return;
  }
  if(!pass||val===pass){
    localStorage.setItem('kosin_reviewer_name',rv);
    sessionStorage.setItem('kosin_admin_ok','1');
    unlock();
  }else{
    $('#lockErr').textContent='รหัสผ่านไม่ถูกต้อง';
    $('#lockPass').value='';$('#lockPass').focus();
  }
}
$('#lockBtn').onclick=tryUnlock;
$('#lockPass').addEventListener('keydown',e=>{if(e.key==='Enter')tryUnlock();});
$('#lockReviewer').addEventListener('keydown',e=>{if(e.key==='Enter')$('#lockPass').focus();});
if(sessionStorage.getItem('kosin_admin_ok')==='1'&&reviewerName())unlock();
else $('#lockReviewer').focus();
</script>
</body>
</html>
